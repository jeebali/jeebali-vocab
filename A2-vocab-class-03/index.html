<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class 03 Vocabulary — Active & Passive Words</title>
<style>
:root{
  --red:#D9232E;
  --blue:#1A69E2;
  --blue-dark:#0D54BA;
  --ink:#172033;
  --muted:#6E788C;
  --paper:#ffffff;
  --bg:#F2F6FB;
  --line:#DDE5EF;
  --shadow:0 16px 40px rgba(23,32,51,.12);
  --soft-shadow:0 10px 24px rgba(23,32,51,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(26,105,226,.07), transparent 28%),
    radial-gradient(circle at 90% 100%, rgba(217,35,46,.06), transparent 24%),
    var(--bg);
}
button{font:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

#homeScreen{align-items:center;justify-content:center;padding:28px 18px}
.home-shell{
  width:min(760px,100%);
  background:rgba(255,255,255,.84);
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(8px);
  border-radius:32px;
  box-shadow:var(--shadow);
  padding:clamp(24px,5vw,48px);
  text-align:center;
}
.mini-label{font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:.78rem;margin-bottom:16px}
.class-title{
  width:100%;
  border:0;
  border-radius:22px;
  padding:22px 24px;
  background:var(--red);
  color:#fff;
  font-size:clamp(1.45rem,4vw,2.3rem);
  font-weight:900;
  box-shadow:0 10px 0 rgba(161,23,32,.14),0 16px 28px rgba(217,35,46,.2);
  cursor:default;
}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.choice-btn{
  min-height:118px;border:0;border-radius:22px;color:#fff;background:var(--blue);
  font-size:clamp(1.15rem,3vw,1.6rem);font-weight:900;cursor:pointer;
  box-shadow:0 12px 24px rgba(26,105,226,.2);
  transition:transform .16s ease, background .16s ease;
}
.choice-btn:hover{background:var(--blue-dark);transform:translateY(-2px)}
.choice-btn .sub{display:block;margin-top:6px;font-size:.8rem;opacity:.86;font-weight:650}

#activeScreen{flex-direction:column;padding:18px clamp(12px,3vw,34px) 28px}
.topbar{width:min(1420px,100%);margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.home-btn, .nav-btn{
  border:0;border-radius:14px;padding:12px 16px;background:#fff;color:var(--ink);
  font-weight:850;cursor:pointer;box-shadow:var(--soft-shadow)
}
.page-title{text-align:center;flex:1}
.page-title h1{margin:0;font-size:clamp(1.22rem,3vw,1.78rem)}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:.95rem;font-weight:700}
.progress-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:.86rem;font-weight:800;color:var(--muted);white-space:nowrap}

.cards{width:min(1420px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1;align-items:stretch}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;
  box-shadow:var(--soft-shadow);display:flex;flex-direction:column;min-width:0
}
.word-line{display:flex;align-items:center;justify-content:center;gap:8px}
.word{margin:0;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:950;letter-spacing:-.03em}
.audio-mini{
  width:36px;height:36px;border-radius:50%;border:0;background:#EDF4FF;color:var(--blue);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 36px
}
.audio-mini:hover{background:#E2EEFF}
.headset-icon{width:20px;height:20px;display:block;flex:0 0 auto}
.arabic-word{text-align:center;direction:rtl;font-size:.98rem;font-weight:760;color:var(--muted);margin:4px 0 12px;line-height:1.4}
.picture{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#EAF3FB;border:1px solid #E0E8F3}
.picture svg{width:100%;height:100%;display:block}
.collocation-line{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:38px}
.collocation{text-align:center;font-weight:900;font-size:clamp(1rem,1.8vw,1.18rem);line-height:1.25}
.collocation-audio{width:32px;height:32px;flex:0 0 32px}
.collocation-audio .headset-icon{width:17px;height:17px}
.arabic-collocation{text-align:center;direction:rtl;color:var(--muted);font-weight:730;font-size:.9rem;line-height:1.35;margin-top:4px}
.card-footer{margin-top:auto;padding-top:15px;display:flex;justify-content:center}
.ex-btn{
  width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:#fff;
  font-weight:950;font-size:1rem;cursor:pointer;box-shadow:0 10px 18px rgba(26,105,226,.22);
  transition:transform .15s ease, background .15s ease
}
.ex-btn:hover{transform:scale(1.06);background:var(--blue-dark)}

.bottom-nav{width:min(1420px,100%);margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav-btn.primary{background:var(--blue);color:#fff}
.nav-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.page-dots{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:#D5DCE7}
.dot.active{background:var(--blue);transform:scale(1.15)}

.modal-overlay{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(17,24,39,.28);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)
}
.modal-overlay.open{display:flex}
.example-box{
  width:min(650px,92vw);background:#fff;border-radius:28px;padding:clamp(28px,6vw,46px);
  box-shadow:0 30px 80px rgba(0,0,0,.24);text-align:center;animation:pop .16s ease-out
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.example-sentence{margin:0;font-size:clamp(1.35rem,4vw,2rem);line-height:1.45;font-weight:850}
.headset-btn{
  margin-top:24px;width:68px;height:68px;border:0;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  box-shadow:0 10px 20px rgba(26,105,226,.23)
}
.headset-btn .headset-icon{width:31px;height:31px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#172033;color:#fff;padding:12px 18px;border-radius:999px;font-weight:750;
  opacity:0;pointer-events:none;transition:.22s ease;z-index:150;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:650px){
  #activeScreen{padding:12px 10px 20px}
  .choice-grid{grid-template-columns:1fr}
  .choice-btn{min-height:96px}
  .topbar{align-items:flex-start}
  .progress-pill{display:none}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:11px;border-radius:18px}
  .picture{border-radius:14px}
  .word{font-size:1.34rem}
  .arabic-word{font-size:.78rem;margin-bottom:8px}
  .collocation-line{margin-top:9px;gap:5px;min-height:32px}
  .collocation{font-size:.9rem}
  .collocation-audio{width:29px;height:29px;flex-basis:29px}
  .collocation-audio .headset-icon{width:15px;height:15px}
  .arabic-collocation{font-size:.74rem}
  .ex-btn{width:44px;height:44px;font-size:.88rem}
  .audio-mini{width:31px;height:31px;flex-basis:31px}
  .audio-mini .headset-icon{width:17px;height:17px}
  .home-btn,.nav-btn{padding:10px 12px}
  .bottom-nav{margin-top:12px;flex-direction:column}
  .page-dots{order:3}
}
</style>
</head>
<body>

<section id="homeScreen" class="screen active">
  <main class="home-shell">
    <div class="mini-label">A2 Vocabulary App</div>
    <div class="class-title">Class 03 Vocabulary</div>
    <div class="choice-grid">
      <button class="choice-btn" id="activeBtn">
        Active Words
        <span class="sub">27 words • 7 pages</span>
      </button>
      <button class="choice-btn" id="passiveBtn">
        Passive Words
        <span class="sub">43 words • 11 pages</span>
      </button>
    </div>
  </main>
</section>

<section id="activeScreen" class="screen">

  <main class="cards" id="cards"></main>

  <nav class="bottom-nav">

    <div class="page-dots" id="pageDots"></div>
    <button class="nav-btn primary" id="nextBtn">Next →</button>
  </nav>
</section>

<div class="modal-overlay" id="exampleOverlay" aria-hidden="true">

        <path d="M4 13v-1a8 8 0 0 1 16 0v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

ic": "يركب / يصعد إلى وسيلة نقل", "collocation": "board a plane", "collocationArabic": "يركب الطائرة", "example": "We boarded the plane at 8 o'clock.", "svg": "<svg viewBox=\"0 0 320 240\" role=\"img\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"320\" height=\"240\" rx=\"20\" fill=\"#DCEAF7\"/>\n    \n    <rect y=\"182\" width=\"320\" height=\"58\" fill=\"#BCC6D5\"/>\n    \n    <g transform=\"translate(102,108) scale(1.0)\">\n      <path d=\"M0 22 H124 Q145 22 157 36 Q145 50 123 50 H0 Z\" fill=\"#F4F6FA\" stroke=\"#A6B8CC\" stroke-width=\"3\"/>\n      <path d=\"M70 22 L90 -30 H108 L100 22 Z\" fill=\"#1F6DE2\"/>\n      <path d=\"M42 50 L15 92 H34 L69 50 Z\" fill=\"#1F6DE2\"/>\n      <circle cx=\"40\" cy=\"53\" r=\"8\" fill=\"#344257\"/>\n      <circle cx=\"123\" cy=\"53\" r=\"8\" fill=\"#344257\"/>\n    </g>\n    \n    <rect x=\"46\" y=\"116\" width=\"56\" height=\"66\" rx=\"6\" fill=\"#F6F8FB\"/>\n    <rect x=\"56\" y=\"128\" width=\"34\" height=\"12\" rx=\"2\" fill=\"#9CD2F5\"/>\n    \n    <g transform=\"translate(100,174) scale(1.05)\">\n      <circle cx=\"0\" cy=\"-18\" r=\"9\" fill=\"#F0B39D\"/>\n      <path d=\"M0 -8 L0 14\" stroke=\"#3E4B63\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      <path d=\"M0 -2 L-12 8\" stroke=\"#3E4B63\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      <path d=\"M1 -2 L13 7\" stroke=\"#3E4B63\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      <path d=\"M0 14 L-10 30\" stroke=\"#3E4B63\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      <path d=\"M0 14 L9 30\" stroke=\"#3E4B63\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n    </g>\n    \n    \n    </svg>"}, {"word": "bridge", "arabic": "جسر", "collocation": "cross a bridge", "collocationArabic": "يعبر جسرًا", "example": "We crossed a bridge on the way to the village.", "svg": "<svg viewBox=\"0 0 320 240\" role=\"img\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"320\" height=\"240\" rx=\"20\" fill= const sectionSubtitle = document.getElementById('sectionSubtitle');
const dotsEl = document.getElementById('pageDots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const overlay = document.getElementById('exampleOverlay');
const exampleBox = document.getElementById('exampleBox');
const sentenceEl = document.getElementById('exampleSentence');
const exampleAudio = document.getElementById('exampleAudio');
const toast = document.getElementById('toast');

function openSection(sectionName, words){
  currentSectionName = sectionName;
  currentWords = words;
  homeScreen.classList.remove('active');
  activeScreen.classList.add('active');
  sectionTitle.textContent = sectionName;
  sectionSubtitle.textContent = 'Class 03 • Travel, Transport & Places';
  renderPage(0);
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('activeBtn').addEventListener('click', () => {
  openSection('Active Words', ACTIVE_WORDS);
});

document.getElementById('passiveBtn').addEventListener('click', () => {
  openSection('Passive Words', PASSIVE_WORDS);
});

document.getElementById('homeBtn').addEventListener('click', () => {
  activeScreen.classList.remove('active');
  homeScreen.classList.add('active');
  closeOverlay();
  window.scrollTo({top:0, behavior:'instant'});
});

prevBtn.addEventListener('click', () => {
  if(currentPage > 0) renderPage(currentPage - 1);
});

nextBtn.addEventListener('click', () => {
  const totalPages = Math.ceil(currentWords.length / PAGE_SIZE);
  if(currentPage < totalPages - 1) renderPage(currentPage + 1);
});

overlay.addEventListener('click', () => closeOverlay());
exampleBox.addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeOverlay();
});

exampleAudio.addEventListener('click', () => speakBritish(currentSentence));

function renderPage(pageIndex){
  const totalPages = Math.ceil(currentWords.length / PAGE_SIZE);
  currentPage = Math.max(0, Math.min(pageIndex, totalPages - 1));
  const start = currentPage * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageWords = currentWords.slice(start, end);

  cardsEl.innerHTML = pageWords.map(item => `
    <article class="card">
      <div class="word-line">
        <h2 class="word">${escapeHtml(item.word)}</h2>
        <button class="audio-mini speak-word" data-text="${escapeAttr(item.word)}" aria-label="Pronounce ${escapeAttr(item.word)}">
          ${headsetSVG}
        </button>
      </div>
      <div class="arabic-word">${escapeHtml(item.arabic)}</div>

      <div class="picture">${item.svg}</div>

      <div class="collocation-line">
        <div class="collocation">${escapeHtml(item.collocation)}</div>
        <button class="audio-mini collocation-audio speak-collocation" data-text="${escapeAttr(item.collocation)}" aria-label="Pronounce ${escapeAttr(item.collocation)}">
          ${headsetSVG}
        </button>
      </div>
      <div class="arabic-collocation">${escapeHtml(item.collocationArabic)}</div>

      <div class="card-footer">
        <button class="ex-btn show-example" data-example="${escapeAttr(item.example)}" aria-label="Show example for ${escapeAttr(item.word)}">EX</button>
      </div>
    </article>
  `).join('');

  progressPill.textContent = `Page ${currentPage + 1} of ${totalPages}`;

  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage === totalPages - 1;

  dotsEl.innerHTML = Array.from({length: totalPages}, (_, i) =>
    `<button class="dot ${i === currentPage ? 'active' : ''}" aria-label="Go to page ${i+1}" data-page="${i}" style="border:0;cursor:pointer"></button>`
  ).join('');

  dotsEl.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => renderPage(Number(dot.dataset.page)));
  });

  bindCardEvents();
  window.scrollTo({top:0, behavior:'smooth'});
}

function bindCardEvents(){
  document.querySelectorAll('.speak-word, .speak-collocation').forEach(btn => {
    btn.addEventListener('click', () => speakBritish(btn.dataset.text));
  });

  document.querySelectorAll('.show-example').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSentence = btn.dataset.example;
      sentenceEl.textContent = currentSentence;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
    });
  });
}

function closeOverlay(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

function showToast(message){
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

function speakBritish(text){
  if(!text) return;
  if(!('speechSynthesis' in window)){
    showToast('Speech is not supported by this browser.');
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-GB';
  utter.rate = 0.88;
  utter.pitch = 1;

  const voices = speechSynthesis.getVoices();
  const preferredBritishNames = /google uk english female|google uk english male|sonia|libby|serena|kate|susan|hazel|martha|daniel|ryan|oliver|arthur/i;
  const exactGB = voices.filter(v => /^en[-_]GB$/i.test(v.lang));
  const namedBritish = voices.filter(v => preferredBritishNames.test(v.name) && /^en/i.test(v.lang));
  const british = exactGB.find(v => preferredBritishNames.test(v.name)) || exactGB[0] || namedBritish[0];
  if(british) utter.voice = british;

  speechSynthesis.speak(utter);
}

function escapeHtml(str){
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function escapeAttr(str){
  return escapeHtml(str);
}

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
</body>
</html>
