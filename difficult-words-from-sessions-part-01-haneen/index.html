<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Difficult Words From Sessions | PART 01 | Haneen</title>
<style>
:root{
  --red:#D9232E;
  --red-dark:#B51D27;
  --blue:#1A69E2;
  --blue-dark:#0D54BA;
  --ink:#172033;
  --muted:#6E788C;
  --paper:#ffffff;
  --bg:#F2F6FB;
  --line:#DDE5EF;
  --shadow:0 16px 40px rgba(23,32,51,.12);
  --soft-shadow:0 10px 24px rgba(23,32,51,.10);
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);background:var(--bg)
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(26,105,226,.07), transparent 28%),
    radial-gradient(circle at 90% 100%, rgba(217,35,46,.06), transparent 24%),
    var(--bg);
}
button{font:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

#homeScreen{align-items:center;justify-content:center;padding:28px 18px}
.home-shell{
  width:min(790px,100%);
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.86);
  backdrop-filter:blur(8px);
  border-radius:32px;
  box-shadow:var(--shadow);
  padding:clamp(26px,5vw,52px);
  text-align:center;
}
.mini-label{
  font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-size:.78rem;margin-bottom:16px
}
.home-title{margin:0 0 10px;font-size:clamp(1.65rem,5vw,2.7rem);font-weight:950;letter-spacing:-.03em}
.home-sub{margin:0 auto 28px;max-width:650px;color:var(--muted);line-height:1.65;font-weight:650}
.class-title{
  width:100%;border:0;border-radius:24px;padding:24px 24px;background:var(--red);color:#fff;
  font-size:clamp(1.35rem,4vw,2rem);font-weight:950;
  box-shadow:0 10px 0 rgba(161,23,32,.14),0 16px 28px rgba(217,35,46,.2);
  cursor:pointer;transition:transform .16s ease,background .16s ease;
}
.class-title:hover{transform:translateY(-2px);background:var(--red-dark)}
.home-meta{margin-top:18px;color:var(--muted);font-size:.92rem;font-weight:800}

#learnScreen{flex-direction:column;padding:18px clamp(12px,3vw,34px) 28px}
.topbar{
  width:min(1420px,100%);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:space-between;gap:14px
}
.home-btn,.nav-btn{
  border:0;border-radius:14px;padding:12px 16px;background:#fff;color:var(--ink);
  font-weight:850;cursor:pointer;box-shadow:var(--soft-shadow)
}
.page-title{text-align:center;flex:1;min-width:0}
.page-title h1{margin:0;font-size:clamp(1.12rem,2.8vw,1.72rem)}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:.95rem;font-weight:700}
.progress-pill{
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;
  font-size:.86rem;font-weight:800;color:var(--muted);white-space:nowrap
}
.cards{
  width:min(1420px,100%);margin:0 auto;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
  flex:1;align-items:stretch
}
.cards.two-last{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards.two-last .card:first-child{grid-column:2}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;
  box-shadow:var(--soft-shadow);display:flex;flex-direction:column;min-width:0
}
.word-line{display:flex;align-items:center;justify-content:center;gap:8px;min-height:47px}
.word{
  margin:0;font-size:clamp(1.28rem,2.3vw,1.95rem);
  font-weight:950;letter-spacing:-.03em;text-align:center;line-height:1.12;word-break:break-word
}
.audio-mini{
  width:36px;height:36px;border-radius:50%;border:0;background:#EDF4FF;color:var(--blue);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 36px
}
.audio-mini:hover{background:#E2EEFF}
.headset-icon{width:20px;height:20px;display:block;flex:0 0 auto}
.arabic-word{
  text-align:center;direction:rtl;font-size:.98rem;font-weight:760;color:var(--muted);
  margin:4px 0 12px;line-height:1.4;min-height:28px
}
.picture{
  width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;
  background:#EAF3FB;border:1px solid #E0E8F3
}
.picture svg{width:100%;height:100%;display:block}
.card-footer{margin-top:auto;padding-top:15px;display:flex;justify-content:center}
.ex-btn{
  width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:#fff;
  font-weight:950;font-size:1rem;cursor:pointer;box-shadow:0 10px 18px rgba(26,105,226,.22);
  transition:transform .15s ease,background .15s ease
}
.ex-btn:hover{transform:scale(1.06);background:var(--blue-dark)}
.bottom-nav{
  width:min(1420px,100%);margin:18px auto 0;
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.nav-btn.primary{background:var(--blue);color:#fff}
.nav-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.page-dots{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;max-width:68%}
.dot{width:10px;height:10px;border-radius:50%;background:#D5DCE7;border:0;cursor:pointer;padding:0}
.dot.active{background:var(--blue);transform:scale(1.18)}

.modal-overlay{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(17,24,39,.28);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)
}
.modal-overlay.open{display:flex}
.example-box{
  width:min(650px,92vw);background:#fff;border-radius:28px;padding:clamp(28px,6vw,46px);
  box-shadow:0 30px 80px rgba(0,0,0,.24);text-align:center;animation:pop .16s ease-out
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.example-sentence{margin:0;font-size:clamp(1.35rem,4vw,2rem);line-height:1.45;font-weight:850}
.example-word{font-size:.86rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--muted);margin-bottom:14px}
.headset-btn{
  margin:24px auto 0;width:68px;height:68px;border:0;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  box-shadow:0 10px 20px rgba(26,105,226,.23)
}
.headset-btn .headset-icon{width:31px;height:31px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#172033;color:#fff;padding:12px 18px;border-radius:999px;font-weight:750;
  opacity:0;pointer-events:none;transition:.22s ease;z-index:150;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){
  .cards,.cards.two-last{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards.two-last .card:first-child{grid-column:auto}
}
@media(max-width:650px){
  #learnScreen{padding:12px 10px 20px}
  .topbar{align-items:flex-start}
  .progress-pill{display:none}
  .cards,.cards.two-last{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:11px;border-radius:18px}
  .picture{border-radius:14px}
  .word{font-size:1.12rem}
  .arabic-word{font-size:.78rem;margin-bottom:8px;min-height:22px}
  .ex-btn{width:44px;height:44px;font-size:.88rem}
  .audio-mini{width:31px;height:31px;flex-basis:31px}
  .audio-mini .headset-icon{width:17px;height:17px}
  .home-btn,.nav-btn{padding:10px 12px}
  .bottom-nav{margin-top:12px;flex-direction:column}
  .page-dots{order:3;max-width:100%}
}
@media(max-width:390px){
  .word-line{gap:5px}
  .word{font-size:1rem}
  .audio-mini{width:29px;height:29px;flex-basis:29px}
}
</style>
</head>

ord": "pay", "arabic": "يدفع", "example": "I pay for my food at the counter.", "scene": "pay"}, {"word": "fairly", "arabic": "بعدل / بصورة عادلة", "example": "The manager treats everyone fairly.", "scene": "fair"}, {"word": "on time", "arabic": "في الموعد", "example": "I arrive at work on time.", "scene": "ontime"}, {"word": "bug", "arabic": "خلل برمجي", "example": "This bug makes the app stop.", "scene": "bug"}, {"word": "software engineer", "arabic": "مهندس برمجيات", "example": "The software engineer writes code.", "scene": "softeng"}, {"word": "computer programming", "arabic": "برمجة الحاسوب", "example": "I study computer programming.", "scene": "programming"}, {"word": "office", "arabic": "مكتب", "example": "My office is on the second floor.", "scene": "office"}, {"word": "explain", "arabic": "يشرح", "example": "The teacher explains the lesson clearly.", "scene": "teacher"}, {"word": "rule", "arabic": "قاعدة", "example": "This rule is easy to follow.", "scene": "rule"}, {"word": "general rules", "arabic": "قواعد عامة", "example": "The general rules are on the wall.", "scene": "rules"}, {"word": "main", "arabic": "رئيسي", "example": "This is the main road.", "scene": "mainroad"}, {"word": "main goal", "arabic": "الهدف الرئيسي", "example": "Our main goal is good service.", "scene": "maingoal"}, {"word": "skilled workers", "arabic": "عمال مهرة", "example": "Skilled workers build the machine.", "scene": "workers"}, {"word": "every", "arabic": "كل", "example": "I study English every day.", "scene": "every"}, {"word": "store data", "arabic": "يخزّن البيانات", "example": "Computers store data in files.", "scene": "data"}, {"word": "mechanic", "arabic": "ميكانيكي", "example": "The mechanic fixes cars.", "scene": "mechanic"}, {"word": "break down", "arabic": "يتعطّل", "example": "My car breaks down sometimes.", "scene": "breakdown"}, {"word": "fix the car", "arabic": "يصلح السيارة", "example": "The mechanic is fixing the car now.", "scene": "fixcar"}, {"word": "focus on   homeScreen.classList.remove('active');
  learnScreen.classList.add('active');
  renderPage(0);

});

function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}
function escapeAttr(str){ return escapeHtml(str); }

function renderPage(pageIndex){
  currentPage=Math.max(0,Math.min(pageIndex,totalPages-1));
  const start=currentPage*PAGE_SIZE;
  const pageWords=WORDS.slice(start,start+PAGE_SIZE);
  cardsEl.classList.toggle('two-last',pageWords.length===2);
  cardsEl.innerHTML=pageWords.map((item,i)=>`
    <article class="card">
      <div class="word-line">
        <h2 class="word">${escapeHtml(item.word)}</h2>
        <button class="audio-mini speak-word" data-text="${escapeAttr(item.word)}" aria-label="Pronounce ${escapeAttr(item.word)}">
          ${headsetSVG}
        </button>
      </div>
      <div class="arabic-word">${escapeHtml(item.arabic)}</div>
      <div class="picture">${sceneSVG(item.scene)}</div>
      <div class="card-footer">
        <button class="ex-btn show-example"
          data-example="${escapeAttr(item.example)}"
          data-word="${escapeAttr(item.word)}"
          aria-label="Show example for ${escapeAttr(item.word)}">EX</button>
      </div>
    </article>
  `).join('');

  progressPill.textContent=`Page ${currentPage+1} of ${totalPages}`;
  prevBtn.disabled=currentPage===0;
  nextBtn.disabled=currentPage===totalPages-1;

  dotsEl.innerHTML=Array.from({length:totalPages},(_,i)=>
    `<button class="dot ${i===currentPage?'active':''}" aria-label="Go to page ${i+1}" data-page="${i}"></button>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(dot=>dot.addEventListener('click',()=>renderPage(Number(dot.dataset.page))));
  bindCardEvents();
  window.scrollTo({top:0,behavior:'smooth'});
}

function bindCardEvents(){
  document.querySelectorAll('.speak-word').forEach(btn=>{
    btn.addEventListener('click',()=>speakBritish(btn.dataset.text));
  });
  document.querySelectorAll('.show-example').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentSentence=btn.dataset.example;
      sentenceEl.textContent=currentSentence;
      wordEl.textContent=btn.dataset.word;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden','false');
    });
  });
}
function closeOverlay(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function showToast(message){
  toast.textContent=message;
  toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600);
}
function speakBritish(text){
  if(!text)return;
  if(!('speechSynthesis' in window)){ showToast('Speech is not supported by this browser.'); return; }
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang='en-GB'; utter.rate=.88; utter.pitch=1;
  const voices=speechSynthesis.getVoices();
  const preferred=/google uk english female|sonia|libby|serena|kate|susan|hazel|martha/i;
  const exactGB=voices.filter(v=>/^en[-_]GB$/i.test(v.lang));
  const voice=exactGB.find(v=>preferred.test(v.name))||exactGB[0]||voices.find(v=>/^en/i.test(v.lang));
  if(voice) utter.voice=voice;
  speechSynthesis.speak(utter);
}
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
