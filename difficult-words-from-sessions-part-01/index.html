<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(26,105,226,.07),transparent 28%),radial-gradient(circle at 90% 100%,rgba(217,35,46,.06),transparent 24%),var(--bg)}

.screen{display:none;min-height:100vh}
.screen.active{display:flex}

#homeScreen{align-items:center;justify-content:center;padding:28px 18px}

.mini-label{font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:.78rem;margin-bottom:16px}
.home-title{margin:0 0 12px;font-size:clamp(1.5rem,4vw,2.25rem);letter-spacing:-.03em}
.home-note{margin:0 0 28px;color:var(--muted);font-weight:650;line-height:1.55}
.class-title{width:100%;border:0;border-radius:22px;padding:25px 24px;background:var(--red);color:#fff;font-size:clamp(1.35rem,4vw,2.15rem);font-weight:950;box-shadow:0 10px 0 rgba(161,23,32,.14),0 16px 28px rgba(217,35,46,.2);cursor:pointer;transition:transform .16s ease,background .16s ease}

.home-meta{margin-top:18px;color:var(--muted);font-size:.9rem;font-weight:760}

#vocabScreen{flex-direction:column;padding:18px clamp(12px,3vw,34px) 28px}
.topbar{width:min(1420px,100%);margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.home-btn,.nav-btn{border:0;border-radius:14px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer;box-shadow:var(--soft-shadow)}
.page-title{text-align:center;flex:1;min-width:0}
.page-title h1{margin:0;font-size:clamp(1.22rem,3vw,1.78rem);letter-spacing:-.02em}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:.95rem;font-weight:700}
.progress-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:.86rem;font-weight:800;color:var(--muted);white-space:nowrap}

.cards{width:min(1420px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1;align-items:stretch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--soft-shadow);display:flex;flex-direction:column;min-width:0}
.word-line{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.word{margin:0;text-align:center;font-size:clamp(1.35rem,2.6vw,2rem);font-weight:950;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.audio-mini{width:36px;height:36px;border-radius:50%;border:0;background:#EDF4FF;color:var(--blue);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 36px}

.headset-icon{width:20px;height:20px;display:block;flex:0 0 auto}
.arabic-word{text-align:center;direction:rtl;font-size:1rem;font-weight:780;color:var(--muted);margin:4px 0 12px;line-height:1.45;min-height:24px}

.dot{width:10px;height:10px;border-radius:50%;background:#D5DCE7;border:0;padding:0;cursor:pointer}

.example-kicker{margin:0 0 12px;color:var(--muted);font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.example-sentence{margin:0;font-size:clamp(1.35rem,4vw,2rem);line-height:1.45;font-weight:850}
.headset-btn{margin:24px auto 0;width:68px;height:68px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 10px 20px rgba(26,105,226,.23)}
.headset-btn .headset-icon{width:31px;height:31px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:12px 18px;border-radius:999px;font-weight:750;opacity:0;pointer-events:none;transition:.22s ease;z-index:150;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:650px){

function bgFor(type){
  const warm=['shop','money','bank','document','box','heavy','new','save','folder','dust','book','puzzle','percent','marketing','handshake','film','pilgrimage'];
  const green=['goal','learning','school','check','map','path','location','road','bridge','travel','museum','right','left','organize','calendar','project'];
  const blue=['work','time','computer','eye','chart','chat','plane','science','office','printer','phone','version','refresh','cable','replay'];
  if(warm.includes(type)) return '#FFF6E5';
  if(green.includes(type)) return '#EDF7ED';
  if(blue.includes(type)) return '#EAF3FB';
  return '#F3F0FA';
}
function makeSVG(item,index){
  const sky=bgFor(item.icon);
  return `<svg viewBox="0 0 320 240" role="img" aria-label="Illustration for ${escapeAttr(item.word)}" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="240" rx="20" fill="${sky}"/>
    <circle cx="272" cy="42" r="18" fill="#F3C44E" opacity=".72"/>
    <ellipse cx="160" cy="205" rx="106" ry="17" fill="#9FB2C7" opacity=".16"/>
    <g transform="translate(0 39)">${iconArt(item.icon)}</g>
  </svg>`;
}

const homeScreen=document.getElementById('homeScreen');
const vocabScreen=document.getElementById('vocabScreen');
const cardsEl=document.getElementById('cards');
const progressPill=document.getElementById('progressPill');
const dotsEl=document.getElementById('pageDots');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const overlay=document.getElementById('exampleOverlay');
const exampleBox=document.getElementById('exampleBox');
const sentenceEl=document.getElementById('exampleSentence');
const exampleAudio=document.getElementById('exampleAudio');
const toast=document.getElementById('toast');

function escapeHtml(str){return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function escapeAttr(str){return escapeHtml(str)}
function cleanSpeechText(text){return String(text).replace('organise / organize','organise')}

function renderPage(pageIndex){
  const totalPages=Math.ceil(WORDS.length/PAGE_SIZE);
  currentPage=Math.max(0,Math.min(pageIndex,totalPages-1));
  const start=currentPage*PAGE_SIZE;
  const pageWords=WORDS.slice(start,start+PAGE_SIZE);
  cardsEl.innerHTML=pageWords.map((item,i)=>`<article class="card">
    <div class="word-line"><h2 class="word">${escapeHtml(item.word)}</h2><button class="audio-mini speak-word" data-text="${escapeAttr(item.word)}" aria-label="Pronounce ${escapeAttr(item.word)}">${headsetSVG}</button></div>
    <div class="arabic-word" lang="ar">${escapeHtml(item.ar)}</div>
    <div class="picture">${makeSVG(item,start+i)}</div>
    <div class="card-footer"><button class="ex-btn show-example" data-example="${escapeAttr(item.ex)}" aria-label="Show example for ${escapeAttr(item.word)}">EX</button></div>
  </article>`).join('');
  progressPill.textContent=`Page ${currentPage+1} of ${totalPages}`;
  prevBtn.disabled=currentPage===0;nextBtn.disabled=currentPage===totalPages-1;
  dotsEl.innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="dot ${i===currentPage?'active':''}" aria-label="Go to page ${i+1}" data-page="${i}"></button>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(dot=>dot.addEventListener('click',()=>renderPage(Number(dot.dataset.page))));
  cardsEl.querySelectorAll('.speak-word').forEach(btn=>btn.addEventListener('click',()=>speakBritish(cleanSpeechText(btn.dataset.text))));
  cardsEl.querySelectorAll('.show-example').forEach(btn=>btn.addEventListener('click',()=>{currentSentence=btn.dataset.example;sentenceEl.textContent=currentSentence;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}));
  window.scrollTo({top:0,behavior:'smooth'});
}

function closeOverlay(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');if('speechSynthesis' in window)speechSynthesis.cancel()}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function speakBritish(text){
  if(!text)return;if(!('speechSynthesis' in window)){showToast('Speech is not supported by this browser.');return}
  speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='en-GB';utter.rate=.86;utter.pitch=1;
  const voices=speechSynthesis.getVoices();
  const femaleNames=/sonia|libby|serena|kate|susan|hazel|martha|female|google uk english female/i;
  const exactGB=voices.filter(v=>/^en[-_]GB$/i.test(v.lang));
  const preferred=exactGB.find(v=>femaleNames.test(v.name))||exactGB[0]||voices.find(v=>femaleNames.test(v.name)&&/^en/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(preferred)utter.voice=preferred;speechSynthesis.speak(utter);
}

document.getElementById('startBtn').addEventListener('click',()=>{homeScreen.classList.remove('active');vocabScreen.classList.add('active');renderPage(0)});
document.getElementById('homeBtn').addEventListener('click',()=>{vocabScreen.classList.remove('active');homeScreen.classList.add('active');closeOverlay();window.scrollTo({top:0,behavior:'instant'})});
prevBtn.addEventListener('click',()=>{if(currentPage>0)renderPage(currentPage-1)});
nextBtn.addEventListener('click',()=>{const total=Math.ceil(WORDS.length/PAGE_SIZE);if(currentPage<total-1)renderPage(currentPage+1)});
overlay.addEventListener('click',closeOverlay);exampleBox.addEventListener('click',e=>e.stopPropagation());document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});exampleAudio.addEventListener('click',()=>speakBritish(currentSentence));
if('speechSynthesis' in window){speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
</script>
