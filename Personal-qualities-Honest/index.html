<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Personal Qualities | Honest</title>
  <style>
    :root{
      --bg:#edf3fb;
      --panel:#ffffff;
      --text:#102754;
      --muted:#657998;
      --line:#dbe5f4;
      --blue:#2e6fdf;
      --blue-dark:#1c56bd;
      --blue-soft:#edf3ff;
      --green:#1f9f68;
      --green-soft:#eefaf4;
      --red:#ea202d;
      --red-shadow:#f7c8cd;
      --shadow:0 16px 34px rgba(21,46,92,.08);
      --shadow-strong:0 14px 24px rgba(46,111,223,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%}
    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(180deg,#f3f7fd 0%, var(--bg) 100%);
      color:var(--text);
      padding:24px;
      padding-top:max(24px, env(safe-area-inset-top));
      padding-right:max(24px, env(safe-area-inset-right));
      padding-bottom:max(24px, env(safe-area-inset-bottom));
      padding-left:max(24px, env(safe-area-inset-left));
    }
    button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #8eb4ff;outline-offset:3px}
    .app{max-width:1480px;margin:0 auto}
    .screen{display:none}
    .screen.active{display:block}

    .hero{
      max-width:980px;
      margin:18px auto 0;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.92);
      border-radius:40px;
      box-shadow:0 22px 42px rgba(16,43,88,.08);
      padding:clamp(28px,4vw,46px);
      text-align:center;
    }
    .eyebrow{margin:0 0 18px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-size:clamp(16px,1.7vw,22px)}
    .hero-title{
      margin:0 auto;
      width:min(100%,780px);
      background:var(--red);
      color:#fff;
      border-radius:28px;
      padding:clamp(28px,4vw,40px) 24px;
      box-shadow:0 11px 0 var(--red-shadow);
      font-size:clamp(34px,5vw,66px);
      line-height:1.06;
      font-weight:900;
      letter-spacing:-.03em;
    }
    .hero-info{margin:26px auto 0;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
    .hero-pill{min-height:50px;padding:0 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--muted);box-shadow:var(--shadow)}
    .start-btn{margin-top:30px;min-height:60px;padding:0 28px;border-radius:18px;background:var(--blue);color:#fff;font-size:22px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow-strong);transition:transform .16s ease}
    .start-btn:hover{transform:translateY(-1px)}

    .page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px;flex-wrap:wrap}
    .home-btn,.page-pill,.nav-btn{min-height:56px;padding:0 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:900;color:var(--blue-dark);transition:transform .16s ease}
    .home-btn:hover,.nav-btn:hover:not(:disabled){transform:translateY(-1px)}
    .page-pill{border-radius:999px;color:var(--muted)}
    .page-heading{flex:1 1 420px;text-align:center;align-self:center}
    .page-heading h1{margin:0;font-size:clamp(34px,4vw,58px);line-height:1.05;font-weight:900;letter-spacing:-.03em}
    .page-heading p{margin:8px 0 0;font-size:clamp(18px,2vw,24px);color:var(--muted);font-weight:800}

    .card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:stretch}
    .card-grid.center-two{grid-template-columns:repeat(2,minmax(300px,360px));justify-content:center}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;min-height:100%}
    .word-area{min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;position:relative}
    .word-row{display:flex;align-items:flex-start;justify-content:center;width:100%;position:relative}
    .word-box{width:100%;display:flex;align-items:center;justify-content:center;min-height:64px;padding:0 44px 0 12px}
    .word{margin:0;text-align:center;line-height:1.02;font-weight:900;letter-spacing:-.055em;font-size:40px;word-break:normal;overflow-wrap:normal;hyphens:none;white-space:nowrap;max-width:100%}
    .word-row > .icon-btn{position:absolute;right:0;top:0}
    .collocation-row{display:flex;align-items:flex-start;justify-content:center;gap:8px;flex-wrap:wrap}
    .pos{margin:0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue);border:1px solid #dce8ff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .16s ease}
    .icon-btn:hover{transform:translateY(-1px)}
    .icon-btn svg{width:20px;height:20px;display:block}

    .ar-wrap{margin-top:10px;text-align:center;min-height:42px}
    .ar-btn{min-width:44px;height:34px;padding:0 12px;border-radius:999px;background:var(--green-soft);color:var(--green);border:1px solid #ccefdc;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
    .ar-text{margin-top:8px;min-height:22px;font-size:18px;font-weight:800;color:#4e5f80;opacity:0;transform:translateY(-3px);transition:opacity .18s ease, transform .18s ease}
    .ar-text.show{opacity:1;transform:translateY(0)}

    .art{margin:14px 0 16px;background:#dce8f5;border:1px solid #d2e1f1;border-radius:20px;overflow:hidden;aspect-ratio:4/3}
    .art svg{width:100%;height:100%;display:block}

    .collocation-wrap{margin-top:auto}
    .collocation{margin:0;font-size:clamp(18px,1.45vw,28px);font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.2}
    .ex-wrap{margin-top:14px;display:flex;justify-content:center}
    .ex-btn{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:var(--shadow-strong);transition:transform .16s ease}
    .ex-btn:hover{transform:translateY(-1px)}

    .nav-row{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .nav-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:var(--shadow-strong)}
    .nav-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .dots{display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
    .dot{width:13px;height:13px;border-radius:50%;background:#d0d8e8;border:none;padding:0;box-shadow:none;min-height:auto}
    .dot.active{background:var(--blue)}

    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(8,24,50,.52);backdrop-filter:blur(7px);z-index:1000}
    .modal.open{display:flex}
    .modal-card{width:min(760px,100%);background:#fff;border-radius:30px;box-shadow:0 30px 70px rgba(10,28,58,.26);padding:28px 24px 24px;position:relative;text-align:center}
    .close-btn{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
    .modal-label{margin:0;font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .modal-collocation-row{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
    .modal-collocation{margin:0;font-size:clamp(28px,3.5vw,44px);line-height:1.1;font-weight:900;letter-spacing:-.03em}
    .modal-example{margin:18px auto 0;max-width:580px;font-size:clamp(21px,2vw,30px);line-height:1.5;font-weight:600;color:#23365d}
    .modal-audio{margin-top:22px;display:flex;justify-content:center}
    .modal-audio .icon-btn{width:56px;height:56px;background:var(--blue);color:#fff;border:none;box-shadow:var(--shadow-strong)}

    @media (max-width: 1180px){
      .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .card-grid.center-two{grid-template-columns:repeat(2,minmax(280px,1fr))}
    }
    @media (max-width: 760px){
      body{padding:16px}
      .hero{padding:24px 18px;border-radius:30px}
      .hero-title{border-radius:22px;box-shadow:0 8px 0 var(--red-shadow)}
      .page-top{display:grid;grid-template-columns:1fr;gap:12px}
      .page-heading{text-align:center}
      .home-btn,.page-pill{justify-content:center}
      .card-grid,.card-grid.center-two{grid-template-columns:1fr;justify-content:stretch}
      .card{border-radius:24px;padding:16px 14px 14px}
      .word-area{min-height:96px}
      .word-box{min-height:56px;padding:0 42px 0 8px}
      .word{font-size:33px}
      .nav-row{position:sticky;bottom:max(8px, env(safe-area-inset-bottom));background:rgba(237,243,251,.94);backdrop-filter:blur(8px);padding-top:10px}
      .dot{width:11px;height:11px}
      .modal{padding:14px}
      .modal-card{padding:24px 16px 20px;border-radius:24px}
    }
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <section class="screen active" id="homeScreen" aria-label="Home screen">
      <div class="hero">
        <p class="eyebrow">Vocabulary Learning App</p>
        <div class="hero-title">Personal Qualities | Honest</div>
        <div class="hero-info">
          <div class="hero-pill">18 words</div>
          <div class="hero-pill">5 pages</div>
          <div class="hero-pill">Real-life examples</div>
        </div>
        <button class="start-btn" id="startBtn" type="button">Start Learning →</button>
      </div>
    </section>

    <section class="screen" id="vocabScreen" aria-label="Vocabulary page">
      <div class="page-top">
        <button class="home-btn" id="homeBtn" type="button" aria-label="Go back to home">← Home</button>
        <div class="page-heading">
          <h1>Personal Qualities | Honest</h1>
          <p id="pageSummary">Words 1–4 of 18</p>
        </div>
        <div class="page-pill" id="pagePill">Page 1 of 5</div>
      </div>

      <main class="card-grid" id="cardGrid"></main>

      <div class="nav-row" aria-label="Navigation">
        <button class="nav-btn" id="prevBtn" type="button">← Previous</button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn primary" id="nextBtn" type="button">Next →</button>
      </div>
    </section>
  </div>

  <div class="modal" id="exampleModal" role="dialog" aria-modal="true" aria-labelledby="modalCollocation" aria-describedby="modalExample">
    <div class="modal-card">
      <button class="close-btn" id="closeModalBtn" type="button" aria-label="Close example">×</button>
      <p class="modal-label">Collocation + Example</p>
      <div class="modal-collocation-row">
        <h2 class="modal-collocation" id="modalCollocation"></h2>
        <button class="icon-btn" id="modalCollocationAudio" type="button" aria-label="Listen to collocation"></button>
      </div>
      <p class="modal-example" id="modalExample"></p>
      <div class="modal-audio">
        <button class="icon-btn" id="modalExampleAudio" type="button" aria-label="Listen to example"></button>
      </div>
    </div>
  </div>

      { word:'open', pos:'adjective', arabicWord:'صريح / منفتح', collocation:'be open with someone', arabicCollocation:'يكون صريحًا مع شخص', example:'I try to be open with my parents when I have a problem.', scene:'open' },
      { word:'trust', pos:'noun', arabicWord:'الثقة', collocation:'build trust', arabicCollocation:'يبني الثقة', example:'Keeping your promises helps build trust with other people.', scene:'trustNoun' },
      { word:'trust', pos:'verb', arabicWord:'يثق بـ', collocation:'trust someone', arabicCollocation:'يثق بشخص', example:'I trust my best friend because she never lies to me.', scene:'trustVerb' },
      { word:'authenticity', pos:'noun', arabicWord:'الأصالة / الصدق مع النفس', collocation:'personal authenticity', arabicCollocation:'الأصالة الشخصية / الصدق مع النفس', example:'People respect her personal authenticity because she is always herself.', scene:'authenticity' },
      { word:'frank', pos:'adjective', arabicWord:'صريح', collocation:'a frank discussion', arabicCollocation:'مناقشة صريحة', example:'I had a frank discussion with my manager about the problem.', scene:'frank' },
      { word:'integrity', pos:'noun', arabicWord:'النزاهة / الاستقامة', collocation:'act with integrity', arabicCollocation:'يتصرف بنزاهة', example:'He acted with integrity and returned the wallet he found.', scene:'integrity' },
      { word:'just', pos:'adjective', arabicWord:'عادل', collocation:'a just decision', arabicCollocation:'قرار عادل', example:'The teacher made a just decision and listened to both students.', scene:'just' },
      { word:'openness', pos:'noun', arabicWord:'الصراحة / الانفتاح', collocation:'openness and honesty', arabicCollocation:'الصراحة والصدق', example:'Openness and honesty help us solve problems in our family.', scene:'openness' },
      { word:'plain', pos:'adjective', arabicWord:'صريح / واضح', collocation:'the plain truth', arabicCollocation:'الحقيقة الصريحة', example:'I told him the plain truth about what happened.', scene:'plain' },
      { word:'straightforward', pos:'adjective', arabicWord:'صريح ومباشر', collocation:'a straightforward answer', arabicCollocation:'إجابة صريحة ومباشرة', example:'She gave me a straightforward answer when I asked about the cost.', scene:'straightforward' },
      { word:'trustworthy', pos:'adjective', arabicWord:'جدير بالثقة / موثوق', collocation:'a trustworthy friend', arabicCollocation:'صديق جدير بالثقة', example:'Maya is a trustworthy friend, so I can tell her important things.', scene:'trustworthy' },
      { word:'truthful', pos:'adjective', arabicWord:'صادق', collocation:'a truthful answer', arabicCollocation:'إجابة صادقة', example:'Please give me a truthful answer about what happened.', scene:'truthful' },
      { word:'decency', pos:'noun', arabicWord:'حسن الخلق / اللياقة', collocation:'basic decency', arabicCollocation:'أبسط قواعد حسن الخلق / الاحترام', example:'He showed basic decency and returned the money he found.', scene:'decency' },
      { word:'straight', pos:'adjective', arabicWord:'صريح / مباشر', collocation:'a straight answer', arabicCollocation:'إجابة صريحة ومباشرة', example:'I asked him for a straight answer about the missing money.', scene:'straight' }
    ];

    const homeScreen = document.getElementById('homeScreen');
    const vocabScreen = document.getElementById('vocabScreen');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');
    const pageSummary = document.getElementById('pageSummary');
    const pagePill = document.getElementById('pagePill');
    const cardGrid = document.getElementById('cardGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dots = document.getElementById('dots');
    const modal = document.getElementById('exampleModal');
    const modalCollocation = document.getElementById('modalCollocation');
    const modalExample = document.getElementById('modalExample');
    const modalCollocationAudio = document.getElementById('modalCollocationAudio');
    const modalExampleAudio = document.getElementById('modalExampleAudio');
    const closeModalBtn = document.getElementById('closeModalBtn');

    modalCollocationAudio.innerHTML = headsetIcon;
    modalExampleAudio.innerHTML = headsetIcon;

    let currentPage = 0;
    let activeModalItem = null;
    let lastFocused = null;
    const revealTimers = new Map();
    const totalPages = Math.ceil(vocabularyData.length / PAGE_SIZE);

    startBtn.addEventListener('click', () => showScreen(vocabScreen));
    homeBtn.addEventListener('click', () => showScreen(homeScreen));

    function showScreen(screen){
      [homeScreen, vocabScreen].forEach(el => el.classList.remove('active'));
      screen.classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function pickBritishFemaleVoice(){
      const voices = speechSynthesis.getVoices() || [];
      if(!voices.length) return null;
      const femaleHints = ['female','woman','samantha','serena','martha','kate','fiona','hazel','libby','sonia','susan','zira','moira','victoria','alice','google uk english female'];
      const maleHints = ['male','man','daniel','george','ryan','arthur','oliver'];
      const scored = voices.map(voice => {
        const name = (voice.name || '').toLowerCase();
        const lang = (voice.lang || '').toLowerCase();
        let score = 0;
        if(lang === 'en-gb') score += 70;
        else if(lang.startsWith('en-gb')) score += 65;
        else if(lang.startsWith('en')) score += 25;
        if(name.includes('google uk english female')) score += 90;
        if(femaleHints.some(h => name.includes(h))) score += 30;
        if(maleHints.some(h => name.includes(h))) score -= 35;
        if(voice.localService) score += 4;
        return {voice, score};
      }).sort((a,b)=>b.score-a.score);
      return scored[0]?.voice || null;
    }

    function speakBritish(text){
      if(!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;
      utterance.pitch = 1.06;
      const voice = pickBritishFemaleVoice();
      if(voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    if('speechSynthesis' in window){
      speechSynthesis.getVoices();
      if(typeof speechSynthesis.onvoiceschanged !== 'undefined') {
        speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
      }
    }

    function showTimedArabic(target, text, key){
      target.textContent = text;
      target.classList.add('show');
      if(revealTimers.has(key)) clearTimeout(revealTimers.get(key));
      const timer = setTimeout(() => target.classList.remove('show'), 3000);
      revealTimers.set(key, timer);
    }

    function createCard(item, index){
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="word-area">
          <div class="word-row">
            <div class="word-box">
              <h2 class="word">${item.word}</h2>
            </div>
            <button class="icon-btn word-audio" type="button" aria-label="Listen to ${item.word}">${headsetIcon}</button>
          </div>
          <div class="pos">${item.pos}</div>
        </div>

        <div class="ar-wrap">
          <button class="ar-btn ar-word" type="button" aria-label="Show Arabic meaning for ${item.word}">AR</button>
          <div class="ar-text ar-word-text" aria-live="polite"></div>
        </div>

        <div class="art" aria-hidden="true">${sceneArt[item.scene]()}</div>

        <div class="collocation-wrap">
          <div class="collocation-row">
            <p class="collocation">${item.collocation}</p>
            <button class="icon-btn coll-audio" type="button" aria-label="Listen to ${item.collocation}">${headsetIcon}</button>
          </div>
          <div class="ar-wrap">
            <button class="ar-btn ar-coll" type="button" aria-label="Show Arabic meaning for collocation ${item.collocation}">AR</button>
            <div class="ar-text ar-coll-text" aria-live="polite"></div>
          </div>
        </div>

        <div class="ex-wrap">
          <button class="ex-btn" type="button" aria-label="Open example for ${item.word}">EX</button>
        </div>
      `;

      const wordAudio = card.querySelector('.word-audio');
      const collAudio = card.querySelector('.coll-audio');
      const arWordBtn = card.querySelector('.ar-word');
      const arWordText = card.querySelector('.ar-word-text');
      const arCollBtn = card.querySelector('.ar-coll');
      const arCollText = card.querySelector('.ar-coll-text');
      const exBtn = card.querySelector('.ex-btn');

      wordAudio.addEventListener('click', () => speakBritish(item.word));
      collAudio.addEventListener('click', () => speakBritish(item.collocation));
      arWordBtn.addEventListener('click', () => showTimedArabic(arWordText, item.arabicWord, `word-${index}`));
      arCollBtn.addEventListener('click', () => showTimedArabic(arCollText, item.arabicCollocation, `coll-${index}`));
      exBtn.addEventListener('click', () => openModal(item, exBtn));
      return card;
    }

    function openModal(item, trigger){
      activeModalItem = item;
      lastFocused = trigger;
      modalCollocation.textContent = item.collocation;
      modalExample.textContent = item.example;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      closeModalBtn.focus();
    }

    function closeModal(){
      modal.classList.remove('open');
      document.body.style.overflow = '';
      if(lastFocused) lastFocused.focus();
    }

    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
    modalCollocationAudio.addEventListener('click', () => activeModalItem && speakBritish(activeModalItem.collocation));
    modalExampleAudio.addEventListener('click', () => activeModalItem && speakBritish(activeModalItem.example));

    function renderDots(){
      dots.innerHTML = '';
      for(let i=0;i<totalPages;i++){
        const dot = document.createElement('button');
        dot.className = `dot${i===currentPage ? ' active':''}`;
        dot.type = 'button';
        dot.setAttribute('aria-label', `Go to page ${i+1}`);
        dot.addEventListener('click', () => { currentPage = i; renderPage(); });
        dots.appendChild(dot);
      }
    }

    function renderPage(){
      const start = currentPage * PAGE_SIZE;
      const items = vocabularyData.slice(start, start + PAGE_SIZE);
      const end = start + items.length;
      cardGrid.innerHTML = '';
      cardGrid.classList.toggle('center-two', items.length === 2 && window.innerWidth > 1180);
      items.forEach((item, localIndex) => cardGrid.appendChild(createCard(item, start + localIndex)));
      pageSummary.textContent = `Words ${start+1}–${end} of ${vocabularyData.length}`;
      pagePill.textContent = `Page ${currentPage+1} of ${totalPages}`;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === totalPages - 1;
      prevBtn.setAttribute('aria-disabled', String(currentPage === 0));
      nextBtn.setAttribute('aria-disabled', String(currentPage === totalPages - 1));
      renderDots();
    }

    prevBtn.addEventListener('click', () => {
      if(currentPage > 0){ currentPage--; renderPage(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
    nextBtn.addEventListener('click', () => {
      if(currentPage < totalPages - 1){ currentPage++; renderPage(); window.scrollTo({top:0, behavior:'smooth'}); }
    });

    window.addEventListener('resize', () => {
      const isCentered = cardGrid.classList.contains('center-two');
      if(isCentered || currentPage === totalPages - 1) renderPage();
    });

    renderPage();
  </script>
</body>
</html>
